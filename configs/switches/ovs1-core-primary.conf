# Loopback Interface
auto lo
iface lo inet loopback

# 1. ประกาศ Physical Interfaces ให้ UP
auto eth0 eth1 eth2 eth3 eth4 eth5
iface eth0 inet manual
iface eth1 inet manual
iface eth2 inet manual
iface eth3 inet manual
iface eth4 inet manual
iface eth5 inet manual

# 2. Main Bridge Configuration (br0 - Primary Core)
auto br0
iface br0 inet manual
    # เคลียร์ Bridge เก่าก่อนสร้างใหม่
    pre-up ovs-vsctl del-br br0 2>/dev/null || true
    pre-up ovs-vsctl del-br br1 2>/dev/null || true
    pre-up ovs-vsctl del-br br2 2>/dev/null || true
    pre-up ovs-vsctl del-br br3 2>/dev/null || true
    
    # สร้าง Bridge br0 และเปิด STP (Priority 0x1000 = Primary Root Bridge)
    pre-up ovs-vsctl add-br br0
    pre-up ovs-vsctl set bridge br0 stp_enable=true
    pre-up ovs-vsctl set bridge br0 other_config:stp-priority=0x1000
    
    # สร้าง LACP Bond (eth1 + eth5) เชื่อมต่อไปยัง OVS-Switch-2
    pre-up ovs-vsctl add-bond br0 lacp-bond eth1 eth5 lacp=active bond_mode=balance-tcp
    pre-up ovs-vsctl set port lacp-bond trunks=10,20,30
    
    # เพิ่ม Access/Trunk Ports
    pre-up ovs-vsctl add-port br0 eth0 trunks=10,20,30
    pre-up ovs-vsctl add-port br0 eth2 trunks=10,20,30
    pre-up ovs-vsctl add-port br0 eth3 trunks=10,20,30
    pre-up ovs-vsctl add-port br0 eth4 trunks=10,20,30

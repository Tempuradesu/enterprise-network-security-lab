auto eth0
iface eth0 inet static
    address 192.168.10.100
    netmask 255.255.255.0
    gateway 192.168.10.1

    # 1. กำหนด DNS Server
    up echo -e "nameserver 8.8.8.8\nnameserver 1.1.1.1" > /etc/resolv.conf

    # 2. แก้ไข sources.list ชี้ไปยัง Ubuntu Jammy (22.04 LTS)
    up echo "deb http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse" > /etc/apt/sources.list
    up echo "deb http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse" >> /etc/apt/sources.list
    up echo "deb http://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse" >> /etc/apt/sources.list

    # 3. แสดงกระบวนการติดตั้งบน Console สดๆ จนเริ่มรัน HTTP Server
    post-up echo "=== Starting Network & Package Installation ==="
    post-up sleep 2
    post-up apt-get update -y
    post-up DEBIAN_FRONTEND=noninteractive apt-get install -y python3
    post-up mkdir -p /var/www/html
    post-up echo '<!DOCTYPE html><html><head><style>body{display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:sans-serif;background-color:#f4f4f9;}</style></head><body><h1>Hello! from server</h1></body></html>' > /var/www/html/index.html
    post-up echo "=== Starting Python HTTP Server on Port 80 ==="
    post-up cd /var/www/html && python3 -m http.server 80
